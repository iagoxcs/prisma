name: Deploy produção

# Todo merge em main publica: 1) migrações e Edge Functions no Supabase;
# 2) site estático na KingHost, em https://prisma.ambienteconsulta.com.br.
# O site só sobe se o Supabase atualizar sem erro (o front novo pode depender do schema novo).
# Secrets ficam no environment "production" (GitHub → Settings → Environments). Ver docs/DEPLOY.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Um deploy por vez, na ordem dos merges; nunca cancela um deploy em andamento.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  SITE_URL: https://prisma.ambienteconsulta.com.br

jobs:
  supabase:
    name: Supabase (migrações e Edge Functions)
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # Versão fixa (= devDependency "supabase"): "latest" consulta a API do GitHub
          # sem token e falha com "rate limit exceeded". Atualize junto com o package.json.
          version: 2.120.0
      - name: Vincular projeto
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Migrações pendentes (prévia)
        run: supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD"
      # Falha se o histórico remoto tiver versões que não existem em supabase/migrations/ (ver CLAUDE.md).
      - name: Aplicar migrações
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
      - name: Publicar Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api

  site:
    name: Site (KingHost)
    needs: supabase
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ env.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Trava: NEXT_PUBLIC_* vai para o JS público. Recusa URL que não seja do Supabase e chave secreta.
      - name: Conferir variáveis públicas
        run: bash scripts/check-public-env.sh
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      - name: Conferir o build (sem chave secreta em ./out)
        run: bash scripts/check-public-env.sh out
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      # Marca a versão publicada; o último passo confere que o domínio já serve este commit.
      - name: Gravar versão
        run: |
          test -f out/.htaccess || { echo "::error::out/.htaccess não foi gerado (public/.htaccess)"; exit 1; }
          echo "$GITHUB_SHA" > out/version.txt
      # A ação de FTP exige pasta terminada em "/": normaliza o secret e recusa valor vazio
      # (pasta vazia publicaria na raiz da conta FTP, por cima de outros sites).
      - name: Pasta de destino
        id: ftpdir
        env:
          DIR: ${{ secrets.KINGHOST_FTP_DIR }}
        run: |
          if [ -z "$DIR" ] || [ "$DIR" = "/" ]; then echo "::error::Secret KINGHOST_FTP_DIR vazio ou igual a /"; exit 1; fi
          echo "dir=${DIR%/}/" >> "$GITHUB_OUTPUT"
      # Diagnóstico (só com a variável FTP_LOG_LEVEL=verbose): lista a raiz da conta FTP e a pasta de destino.
      - name: Listar pastas no FTP (diagnóstico)
        if: vars.FTP_LOG_LEVEL == 'verbose'
        continue-on-error: true
        env:
          FTP_HOST: ${{ secrets.KINGHOST_FTP_HOST }}
          FTP_USER: ${{ secrets.KINGHOST_FTP_USER }}
          FTP_PASS: ${{ secrets.KINGHOST_FTP_PASSWORD }}
          DIR: ${{ steps.ftpdir.outputs.dir }}
        run: |
          echo "== raiz da conta"; curl -sSk --ssl-reqd --list-only --user "$FTP_USER:$FTP_PASS" "ftp://$FTP_HOST/" || true
          echo "== pasta de destino"; curl -sSk --ssl-reqd --list-only --user "$FTP_USER:$FTP_PASS" "ftp://$FTP_HOST/$DIR" || true
      # Envio incremental: só arquivos alterados; o estado fica em .ftp-deploy-sync-state.json
      # (bloqueado para download pelo .htaccess).
      - name: Enviar ./out por FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.KINGHOST_FTP_HOST }}
          username: ${{ secrets.KINGHOST_FTP_USER }}
          password: ${{ secrets.KINGHOST_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./out/
          server-dir: ${{ steps.ftpdir.outputs.dir }}   # ex.: /www/prisma/ (conferir no painel da KingHost)
          log-level: ${{ vars.FTP_LOG_LEVEL || 'standard' }}
      - name: Conferir o site no ar
        run: |
          for i in 1 2 3 4 5 6; do
            got=$(curl -fsS --max-time 15 "$SITE_URL/version.txt?t=$(date +%s)" || true)
            if [ "$got" = "$GITHUB_SHA" ]; then echo "Site no ar com ${GITHUB_SHA::7}."; break; fi
            echo "Aguardando o domínio servir a versão nova ($i/6)..."; sleep 10
          done
          [ "$got" = "$GITHUB_SHA" ] || { echo "::error::$SITE_URL não serve a versão publicada. Confira KINGHOST_FTP_DIR (pasta do subdomínio)."; exit 1; }
          curl -fsSI --max-time 15 "$SITE_URL/projetos/" | grep -qi '^x-frame-options: *DENY' \
            || echo "::warning::Cabeçalhos de segurança não aplicados: o .htaccess pode não estar ativo."
