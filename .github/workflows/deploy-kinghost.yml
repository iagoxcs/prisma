name: Deploy produção

# Todo merge em main publica: 1) migrações e Edge Functions no Supabase; 2) site estático na KingHost.
# O site só sobe se o Supabase atualizar sem erro (o front novo pode depender do schema novo).
# Secrets ficam no environment "production" (GitHub → Settings → Environments). Ver docs/DEPLOY-KINGHOST.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Um deploy por vez, na ordem dos merges; nunca cancela um deploy em andamento.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  supabase:
    name: Supabase (migrações e Edge Functions)
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Vincular projeto
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Migrações pendentes (prévia)
        run: supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD"
      # Falha se o histórico remoto tiver versões que não existem em supabase/migrations/ (ver CLAUDE.md).
      - name: Aplicar migrações
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
      - name: Publicar Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api

  site:
    name: Site (KingHost)
    needs: supabase
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      - name: Enviar ./out por FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.KINGHOST_FTP_HOST }}
          username: ${{ secrets.KINGHOST_FTP_USER }}
          password: ${{ secrets.KINGHOST_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./out/
          server-dir: ${{ secrets.KINGHOST_FTP_DIR }}   # ex.: /public_html/ ou /www/
