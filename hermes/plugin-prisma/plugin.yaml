name: prisma
version: 0.12.0
description: "Ferramentas do Prisma via ai-gateway: leitura (inclusive membros do projeto, nome do responsável das tarefas e projetos como 'Projeto - Cliente'), escrita com prévia confirmada por ✅ ou 'sim' do autor do pedido (conferida no Discord pelo plugin), qualquer lista de tarefas (texto, planilha, arquivo ou ata) em lote, numa prévia só (até 30), leitura de arquivos (TXT em UTF-8/UTF-16/Windows-1252, MD, CSV, JSON, VTT/SRT, PDF, DOCX, XLSX, PPTX, ODT/ODS/ODP, RTF, EML com anexos, HTML, BPMN e .zip com cada arquivo de dentro), geração de arquivos (TXT, MD, HTML, DOCX, PDF, XLSX, BPMN; DOCX também no papel timbrado FOR-AMBT-06) e transcrição de mensagens de voz (provedor prisma_stt, API da OpenAI, só na DM). Prévias abertas sobrevivem a um reinício (menos anexos). Conta os tokens do bot e da transcrição (telemetria de custo, O5). Na DM e nos canais do Discord em que o bot é chamado (DP6); o autor vem do contexto da sessão, nunca do LLM."
author: "Ambiente Consultoria"
kind: standalone
provides_tools:
  - prisma_listar_projetos
  - prisma_listar_tarefas
  - prisma_ver_tarefa
  - prisma_listar_membros
  - prisma_buscar_contexto
  - prisma_buscar_conhecimento
  - prisma_criar_tarefa
  - prisma_criar_tarefas_lote
  - prisma_atualizar_tarefa
  - prisma_comentar_tarefa
  - prisma_registrar_contexto
  - prisma_registrar_transcricao
  - prisma_confirmar_acao
  - prisma_cancelar_acao
  - prisma_ler_arquivo
  - prisma_registrar_arquivo
  - prisma_gerar_arquivo
  - prisma_anexar_arquivo
