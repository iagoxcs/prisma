name: prisma
version: 0.2.0
description: "Ferramentas do Prisma via ai-gateway: leitura (projetos, tarefas, contexto e base de conhecimento) e escrita com confirmação por código enviado em DM separada. Só em DM do Discord; o autor vem do contexto da sessão, nunca do LLM."
author: "Ambiente Consultoria"
kind: standalone
provides_tools:
  - prisma_listar_projetos
  - prisma_listar_tarefas
  - prisma_ver_tarefa
  - prisma_buscar_contexto
  - prisma_buscar_conhecimento
  - prisma_criar_tarefa
  - prisma_atualizar_tarefa
  - prisma_comentar_tarefa
  - prisma_registrar_contexto
  - prisma_confirmar_acao
