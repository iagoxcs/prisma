<!doctype html>
<html lang="pt-BR">
<body style="margin:0;background:#f4f4f5;font-family:'Red Hat Display',Arial,sans-serif">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td align="center" style="padding:24px 12px">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border-radius:12px;padding:24px">
      <tr><td style="font-size:18px;font-weight:700;color:#18181b;padding-bottom:12px">Prisma</td></tr>
      <tr><td style="font-size:15px;color:#3f3f46;line-height:1.5">
        Recebemos um pedido para redefinir a senha da sua conta no Prisma ({{ .Email }}).
        O link vale por 1 hora e só pode ser usado uma vez.
      </td></tr>
      <tr><td style="padding:20px 0">
        <a href="{{ .SiteURL }}/redefinir-senha/?token_hash={{ .TokenHash }}&type=recovery"
           style="display:inline-block;background:#18181b;color:#ffffff;text-decoration:none;padding:10px 16px;border-radius:8px;font-size:14px">Definir nova senha</a>
      </td></tr>
      <tr><td style="font-size:12px;color:#a1a1aa;line-height:1.5">
        Se você não pediu, ignore este e-mail: a senha atual continua valendo.<br>
        Prisma · Ambiente Consultoria
      </td></tr>
    </table>
  </td></tr></table>
</body>
</html>
